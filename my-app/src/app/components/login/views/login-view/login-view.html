<div class="w-full h-auto flex items-center justify-center">
  <form class="flex flex-col items-center justify-center text-center gap-8" [formGroup]="loginFormGroup()"
        (ngSubmit)="onFormSubmit()">

    <div class="flex flex-col gap-2 w-full">
      <label for="username">Username</label>
      <input class="border rounded-md" id="username" type="text" formControlName="username"/>
    </div>

    <div class="flex flex-col gap-2 w-full">
      <label for="password">Password</label>
      <input class="border rounded-md" id="password" type="password" formControlName="password"/>
    </div>

    <button mat-button type="submit" [disabled]="loginFormGroup().invalid">
      Login
    </button>

  </form>
</div>
