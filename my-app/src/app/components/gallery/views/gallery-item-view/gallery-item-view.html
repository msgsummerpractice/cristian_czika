<div class="w-full max-w-sm bg-white rounded-xl shadow-md overflow-hidden flex flex-col text-left">
  <div class="w-full h-48 bg-gray-200 overflow-hidden relative">
    <img [src]="dog().imageUrl" [alt]="dog().name" class="w-full h-full object-cover"/>
  </div>

  <div class="p-6 flex flex-col flex-1">
    <h2 class="font-bold text-xl mb-2">{{ dog().name }}</h2>
    <p class="text-gray-600 text-sm">
      <span class="font-semibold">Description:</span> {{ dog().description }}
    </p>
  </div>
</div>
